services:
  redis:
    image: redis:alpine
    container_name: notifymesh-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: notifymesh-rabbitmq
    ports:
      - "5672:5672"    # AMQP protocol
      - "15672:15672"  # RabbitMQ Management Web Dashboard
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped

volumes:
  redis_data:
  rabbitmq_data:
